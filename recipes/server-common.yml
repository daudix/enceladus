modules:
  - type: dnf
    install:
      packages:
        # ======================================================================
        # uCore packages from normal edition, without all the bloat
        # ======================================================================
        - cockpit-storaged
        - duperemove
        - fish
        - man-db
        - pcp-zeroconf
        - rclone
        - smartctl
        - xdg-dbus-proxy
        - xdg-user-dirs
        # ======================================================================
        # Extra
        # ======================================================================
        - borgmatic
    remove:
      packages:
        # ======================================================================
        # uCore packages from minimal edition
        # ======================================================================
        - docker-buildx
        - docker-compose
        - podman-compose
        - tailscale
